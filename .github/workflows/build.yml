name: build-kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'commit, branch or "date:YYYY-MM-DD"'
        required: false
        default: 'date:2025-12-12'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      # The hosted runner ships with several GB of toolchains this job will never
      # use; reclaiming them is what makes a kernel build fit.
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex \
            libssl-dev libelf-dev zstd cpio rsync

      - name: Fetch clang r487747c
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/clang" && cd "$RUNNER_TEMP/clang"
          curl -fsSL -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz"
          tar xzf clang.tar.gz
          echo "CLANG_PATH=$RUNNER_TEMP/clang/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/clang/bin/clang" --version

      - name: Clone kernel source
        run: |
          set -eux
          git clone --shallow-since=2025-10-01 \
            --branch oneplus/sm8750_b_16.0.0_oneplus_ace5_pro \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8750.git kernel
          cd kernel
          ref="${{ github.event.inputs.kernel_ref }}"
          case "$ref" in
            date:*) sha=$(git log --before="${ref#date:} 23:59:59" -1 --format=%H) ;;
            *)      sha="$ref" ;;
          esac
          echo "checking out $sha"
          git checkout "$sha"
          git log -1 --format='%H %ci %s'
          df -h /

      # The driver is dropped in as a plain file plus one Makefile line, so no
      # patch has to be kept in sync with the tree.
      - name: Install driver
        run: |
          set -eux
          cp src/hlmem.c kernel/drivers/misc/hlmem.c
          grep -q 'hlmem.o' kernel/drivers/misc/Makefile || \
            echo 'obj-y += hlmem.o' >> kernel/drivers/misc/Makefile
          tail -3 kernel/drivers/misc/Makefile

      - name: Configure
        run: |
          set -eux
          cd kernel
          cp ../config/device_config .config
          # Pin the release string to the value the device reports, otherwise
          # uname -r changes and every module path on the device breaks.
          scripts/config --file .config -d LOCALVERSION_AUTO
          scripts/config --file .config --set-str LOCALVERSION "-android14-11-o-g64180ab070e5"
          sed -i 's/^VERSION = .*/VERSION = 6/'          Makefile
          sed -i 's/^PATCHLEVEL = .*/PATCHLEVEL = 1/'    Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/'      Makefile
          make ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^CONFIG_(LOCALVERSION|PGTABLE_LEVELS|ARM64_VA_BITS)=' .config

      - name: Build
        run: |
          set -eux
          cd kernel
          make ARCH=arm64 LLVM=1 -j"$(nproc)" Image
          ls -lh arch/arm64/boot/Image
          make ARCH=arm64 LLVM=1 kernelrelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
