name: build-kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'commit, branch or "date:YYYY-MM-DD"'
        required: false
        default: 'date:2025-12-12'
      with_driver:
        description: 'install mmr.c (true/false)'
        required: false
        default: 'true'

env:
  BRANCH: oneplus/sm8650_b_16.0.0_ace_5

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex \
            libssl-dev libelf-dev zstd cpio rsync dwarves

      - name: Cache clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.clang
          key: clang-r487747c-v1

      - name: Fetch clang r487747c
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.clang"
          curl -fsSL -o "$RUNNER_TEMP/clang.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz"
          tar xzf "$RUNNER_TEMP/clang.tar.gz" -C "$GITHUB_WORKSPACE/.clang"
          "$GITHUB_WORKSPACE/.clang/bin/clang" --version

      - name: Put clang on PATH
        run: echo "$GITHUB_WORKSPACE/.clang/bin" >> "$GITHUB_PATH"

      - name: Clone kernel source
        run: |
          set -eux
          git clone --shallow-since=2025-10-01 --branch "$BRANCH" \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8650.git kernel
          cd kernel
          ref="${{ github.event.inputs.kernel_ref }}"
          case "$ref" in
            date:*) sha=$(git log --before="${ref#date:} 23:59:59" -1 --format=%H) ;;
            *)      sha="$ref" ;;
          esac
          git checkout "$sha"
          git log -1 --format='%H %ci %s'
          df -h /

      # OnePlus splits the tree: many directories are symlinks into a separate
      # modules repository, resolved against a workspace layout that does not
      # exist here. Materialise each dangling vendor link as a real directory,
      # falling back to the longest existing prefix when the exact target is
      # absent upstream.
      - name: Materialise vendor symlinks
        run: |
          set -eux
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8650.git modules
          cd kernel
          n=0
          while IFS= read -r l; do
            [ -e "$l" ] && continue
            tgt=$(readlink "$l") || continue
            case "$tgt" in *vendor/*) ;; *) continue ;; esac
            rel=${tgt##*vendor/}
            while [ -n "$rel" ] && [ ! -e "$GITHUB_WORKSPACE/modules/vendor/$rel" ]; do
              case "$rel" in
                */*) rel=${rel%/*} ;;
                *)   rel="" ;;
              esac
            done
            [ -n "$rel" ] || { echo "unresolved: $l -> $tgt"; continue; }
            src="$GITHUB_WORKSPACE/modules/vendor/$rel"
            rm -f "$l"
            if [ -d "$src" ]; then
              mkdir -p "$l"
              cp -aL "$src/." "$l/" || { echo "copy failed: $l"; continue; }
            else
              cp -aL "$src" "$l" || { echo "copy failed: $l"; continue; }
            fi
            echo "materialised $l from vendor/$rel"
            n=$((n+1))
          done < <(find . -type l)
          echo "total $n"

      - name: Verify vendor tree
        run: |
          set -eux
          cd kernel
          for p in drivers/soc/oplus/storage/common/io_metrics/Kconfig \
                   kernel/oplus_cpu/Kconfig \
                   mm/mm_osvelte/Kconfig; do
            if [ -e "$p" ]; then echo "present: $p"; else echo "absent : $p"; fi
          done
          # kconfig itself is the real test; do not fail here on a layout
          # difference between SoC trees.

      # The driver is dropped in as a plain file plus one Makefile line, so no
      # patch has to be kept in sync with the tree.
      - name: Install driver
        if: ${{ github.event.inputs.with_driver != 'false' }}
        run: |
          set -eux
          cp src/mmr.c kernel/drivers/misc/mmr.c
          grep -q 'mmr.o' kernel/drivers/misc/Makefile || \
            echo 'obj-y += mmr.o' >> kernel/drivers/misc/Makefile
          tail -3 kernel/drivers/misc/Makefile

          # proc_subdir_lock is file-static in fs/proc/generic.c, so the only
          # place an entry can be unlinked from the directory tree is right
          # here. Append a one-line helper rather than duplicating the lock.
          cat >> kernel/fs/proc/generic.c <<'EOF'

          /* Detach a proc entry from its parent's subdirectory tree. */
          void proc_unlink_tree_entry(struct proc_dir_entry *de)
          {
          	if (!de || !de->parent)
          		return;
          	write_lock(&proc_subdir_lock);
          	if (!RB_EMPTY_NODE(&de->subdir_node))
          		rb_erase(&de->subdir_node, &de->parent->subdir);
          	write_unlock(&proc_subdir_lock);
          }
          EOF
          tail -12 kernel/fs/proc/generic.c

      - name: Configure
        run: |
          set -eux
          cd kernel
          cp ../config/device_config .config
          scripts/config --file .config -d LOCALVERSION_AUTO
          scripts/config --file .config --set-str LOCALVERSION ""
          # The device config points the KMI symbol list at a path on OnePlus's
          # build machine. kernel/module/Makefile treats a non-empty value as a
          # hard dependency, so give it a real, empty file to depend on.
          mkdir -p include/config
          : > include/config/abi_gki_kmi_symbols
          scripts/config --file .config --set-str UNUSED_KSYMS_WHITELIST \
            "include/config/abi_gki_kmi_symbols"
          echo "source version before pinning:"; grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          sed -i 's/^VERSION = .*/VERSION = 6/'       Makefile
          sed -i 's/^PATCHLEVEL = .*/PATCHLEVEL = 1/' Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 118/'   Makefile
          # The vendor storage metrics driver in the modules branch is newer than
          # this kernel and calls f2fs tracepoints that do not exist here yet.
          for opt in OPLUS_FEATURE_STORAGE_IO_METRICS_QCOM \
                     OPLUS_FEATURE_STORAGE_IO_METRICS \
                     OPLUS_FEATURE_STORAGE_IO_METRICS_DEBUG; do
            scripts/config --file .config -d "$opt" || true
          done
          # The vendor modules were built against the original kernel's symbol
          # CRCs. Any rebuild from a different commit produces different CRCs,
          # so the kernel must stop checking them or none of the vendor modules
          # will load and rootfs never mounts.
          scripts/config --file .config -d MODVERSIONS
          make ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^CONFIG_MODVERSIONS|MODVERSIONS is not set' .config || true
          grep -E '^CONFIG_OPLUS_FEATURE_STORAGE_IO' .config || echo "io_metrics disabled"
          grep -E '^CONFIG_(LOCALVERSION|PGTABLE_LEVELS|ARM64_VA_BITS)=' .config

      # setlocalversion appends "+" to any tree with local changes unless
      # LOCALVERSION is present in the environment, and it concatenates that
      # value into the release string. The release has to match
      # /vendor/lib/modules/<release>/ exactly or vendor modules fail to load.
      - name: Build
        env:
          LOCALVERSION: '-android14-11-o-g64180ab070e5'
        run: |
          set -eux
          cd kernel
          make ARCH=arm64 LLVM=1 -j"$(nproc)" Image
          ls -lh arch/arm64/boot/Image
          make ARCH=arm64 LLVM=1 kernelrelease

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Image
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
